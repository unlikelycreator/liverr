services:
  - type: web
    name: liverr-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ACCESS_PASSCODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: INR
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        sync: false
